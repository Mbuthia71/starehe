# pgBouncer configuration for Starehian Society Platform
# This configuration is optimized for 10,000+ users with 500-1,500 concurrent connections

[databases]
# Production database connection
starehe_prod = host=postgres.prod.internal port=5432 dbname=starehe_prod
starehe_read = host=postgres-read-replica.prod.internal port=5432 dbname=starehe_prod

# Staging database connection
starehe_staging = host=postgres.staging.internal port=5432 dbname=starehe_staging

[pgbouncer]
# Pool settings
pool_mode = transaction
max_client_conn = 10000
default_pool_size = 50
min_pool_size = 10
reserve_pool_size = 10
reserve_pool_timeout = 3

# Connection settings
server_lifetime = 3600
server_idle_timeout = 600
server_connect_timeout = 15
query_timeout = 300
client_login_timeout = 60

# Authentication
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

# Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60

# Performance tuning
tcp_keepalive = 1
tcp_keepalive_idle = 600
tcp_keepalive_interval = 30
tcp_keepalive_count = 3

# Administrative
admin_users = postgres
stats_users = stats
listen_addr = 0.0.0.0
listen_port = 6432

# Unix socket (optional, for local connections)
unix_socket_dir = /var/run/postgresql
unix_socket_mode = 0777

# Application name prefix (useful for monitoring)
application_name = pgbouncer_starehe

# Disable prepared statements (recommended for transaction pooling)
ignore_startup_parameters = extra_float_digits
