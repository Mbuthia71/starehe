# Redis configuration for Starehian Society Platform
# Optimized for 10,000+ users with session storage, caching, and job queues

# Network
bind 0.0.0.0
port 6379
protected-mode yes
tcp-backlog 511
timeout 0
tcp-keepalive 300

# General
daemonize no
supervised no
pidfile /var/run/redis/redis-server.pid
loglevel notice
logfile ""
databases 16

# Snapshotting (RDB) - Backup persistence
# Save the DB if at least 1 key changed in 900 seconds (15 minutes)
save 900 1
# Save if at least 10 keys changed in 300 seconds (5 minutes)
save 300 10
# Save if at least 10000 keys changed in 60 seconds (1 minute)
save 60 10000

# Stop writing to RDB if background save fails
stop-writes-on-bgsave-error yes

# Compress RDB files
rdbcompression yes

# RDB filename
dbfilename dump.rdb

# RDB directory
dir /var/lib/redis

# Append Only File (AOF) - Write-ahead logging for durability
appendonly yes
appendfilename "appendonly.aof"

# AOF fsync policy: everysec balances performance and durability
# Options: no, everysec, always
appendfsync everysec

# No rewrite if AOF rewrite would use > 64% of old file size
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Load AOF on startup if both RDB and AOF exist
aof-load-truncated yes

# Replication (for HA setup)
# replicaof <masterip> <masterport>
# masterauth <master-password>
replica-serve-stale-data yes
replica-read-only yes
repl-diskless-sync no
repl-diskless-sync-delay 5
repl-disable-tcp-nodelay no
replica-priority 100

# Security
# requirepass your_strong_password_here

# Memory management
maxmemory 4gb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Lazy free (for better performance with large keys)
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Latency monitoring
latency-monitor-threshold 100

# Event notification (optional, for debugging)
notify-keyspace-events ""

# Hashes
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# Lists
list-max-ziplist-size -2
list-compress-depth 0

# Sets
set-max-intset-entries 512

# Sorted sets
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLog
hll-sparse-max-bytes 3000

# Streams
stream-node-max-bytes 4096
stream-node-max-entries 100

# Active rehashing
activerehashing yes

# Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Hz (frequency of background tasks)
hz 10

# Dynamic HZ
dynamic-hz yes

# AOF rewrite incremental fsync
aof-rewrite-incremental-fsync yes

# RDB save incremental fsync
rdb-save-incremental-fsync yes

# Number of databases
databases 16

# Always show logo
always-show-logo yes

# Set process title
set-proc-title yes

# Include additional config files
# include /path/to/local.conf
# include /path/to/other.conf
