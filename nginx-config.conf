server {
    server_name 178.105.238.27 portal.oldstarehians.org;

    location /api {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        root /var/www/starehe-frontend/.output/public;
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/portal.oldstarehians.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/portal.oldstarehians.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = portal.oldstarehians.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name 178.105.238.27 portal.oldstarehians.org;
    return 404; # managed by Certbot
}
